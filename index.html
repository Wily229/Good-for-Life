<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064734"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Life Tree</title>
<style>
@font-face{font-family:'Luckiest Guy';src:url(luckiest.woff2) format('woff2');font-display:swap}
@font-face{font-family:Manrope;src:url(manrope-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Manrope;src:url(manrope-700.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--bg:#064734;--deep:#043628;--card:#0a5a43;--bd:#1b7a5c;--fg:#f1ffe3;--mu:#a9d2b2;--ac:#E0FFC2;--on:#064734;--fruit:#ffb454;--bark:#b08a5e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Manrope,system-ui,sans-serif;font-weight:500;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:18px}h1,h2,h3{font:400 34px/1.05 'Luckiest Guy',Impact,sans-serif;letter-spacing:.02em;margin:6px 0}h2{font-size:28px}h3{font-size:22px;color:var(--ac);margin:26px 0 10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}

button.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--deep);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;font-size:11px;color:var(--mu)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav .on{color:var(--ac)}
.r{display:flex;gap:10px;align-items:center;justify-content:space-between}.m{color:var(--mu);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--deep);margin:7px 0 3px}.bar i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .5s}
.f input:not([type=checkbox]),.f select{width:100%;margin:5px 0}.dy{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.hero{position:relative;margin:-18px -18px 0;min-height:46vh;background:var(--deep) center/cover;overflow:hidden;display:flex;align-items:flex-end}.sc{position:absolute;inset:0;width:100%;height:100%}.hero.ph .sc{display:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(4,54,40,.95))}.ht{position:relative;z-index:1;padding:24px 18px}.ht h1{font-size:42px;color:var(--ac)}.ht p{margin:4px 0 0;font-size:18px}
.pick{width:100%;font-size:17px;margin-top:16px;background:var(--ac);color:var(--on);border-color:var(--ac)}.gb{width:100%;margin-top:10px;background:none;border-color:var(--ac);color:var(--ac)}.bk2{border:0;background:none;color:var(--mu);padding:4px 0;min-height:0}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:16px;background:var(--card);margin-top:10px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:470px}th,td{padding:8px 3px;text-align:center;border-bottom:1px solid var(--bd)}tr:last-child>*{border-bottom:0}
.hn{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding-left:12px;min-width:124px;font-weight:700}.hn span{display:block;font-size:11px;color:var(--mu);font-weight:500}
.dh{border:0;background:none;min-height:0;padding:4px;color:var(--mu);font-size:12px;line-height:1.2}.dh small{display:block;font:400 17px 'Luckiest Guy';color:var(--fg)}.dh.on,.dh.on small{color:var(--ac)}
.cb{width:30px;height:30px;min-height:0;border-radius:8px;padding:0;border:2px solid var(--bd);background:none;color:var(--on)}.cb.on{background:var(--ac);border-color:var(--ac)}
.ce{width:52px;padding:4px;min-height:34px;text-align:center}.z{color:var(--mu);opacity:.5}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sw>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.sw ul{margin:6px 0 0;padding:0;list-style:none}.sw li{display:flex;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tl>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.tl b{display:block;font:400 24px 'Luckiest Guy';color:var(--ac)}.tl span{font-size:12px;color:var(--mu)}
.hr{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--bd)}.hm{flex:1;min-width:0}.hm b{display:block}.hm span{font-size:12.5px;color:var(--mu)}.ls{border-top:1px solid var(--bd);margin-top:12px}
.bg2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);background:var(--card);font:400 17px 'Luckiest Guy';color:var(--ac)}
.tr svg{display:block;max-height:60vh}.bk{fill:none;stroke:var(--bark)}.tk{fill:var(--bark)}.fr{fill:var(--fruit)}.lb{fill:var(--mu);font:700 11px Manrope,sans-serif}
</style></head><body><div id="app"></div><script>
const DOM=[['A','Spiritualité'],['B','Physique'],['C','Mental et émotions'],['D','Engagements spirituels'],['E','Vie professionnelle'],['G','Problèmes de vie'],['H','Développement personnel']],
TY={done:'Fait / pas fait',dur:'Durée',qty:'Quantité',self:'Auto-évaluation (1 à 3)'},
E=new TextEncoder(),$=document.getElementById('app'),$$=i=>document.getElementById(i),
L=(a,f)=>a.map(f).join(''),pc=v=>Math.round(v*100)+' %',msg=t=>$$('ms').textContent=t;
let S,tab='j',locked=true,tries=0,hid=0,DBH;
const b64=b=>{let s='';new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
idb=()=>DBH||(DBH=new Promise((ok,ko)=>{const r=indexedDB.open('lifetree',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})),
dbg=async()=>{const d=await idb();return new Promise(ok=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>ok(q.result)})},
save=async()=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(S,'s');t.oncomplete=ok})};
async function hp(pin,salt){const k=await crypto.subtle.importKey('raw',E.encode(pin),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},k,256))}
async function key(pw,salt,use){const k=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,use)}
const iso=d=>{const t=new Date(d);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)},
day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d},
P=(x,v)=>v==null?0:x.t=='done'?(v?1:0):x.t=='self'?(v-1)/2:Math.min(1,v/x.g),
lvl=p=>{let n=0;while(50*(n+1)*(n+2)<=p)n++;return n};
function disc(hs,n){let pl=0,ok=0,sp=0,dp=0,de=0;for(let i=0;i<n;i++){const d=day(i),k=iso(d);let a=0,e=0;for(const x of hs)if(x.days.includes(d.getDay())){a++;const p=P(x,S.ent[x.id+'|'+k]);sp+=p;if(p>=x.th)ok++;if(p>0)e=1}if(a){dp++;de+=e;pl+=a}}return pl?{E:ok/pl,F:sp/pl,R:de/dp,D:.5*ok/pl+.3*sp/pl+.2*de/dp}:null}
const pts=d=>S.habits.filter(x=>x.d==d).reduce((s,x)=>s+Object.keys(S.ent).filter(k=>k.startsWith(x.id+'|')).reduce((a,k)=>a+P(x,S.ent[k])*x.pts,0),0);
function streak(x){let c=0,b=0,r=0,go=true;for(let i=0;i<365;i++){const d=day(i);if(!x.days.includes(d.getDay()))continue;const v=S.ent[x.id+'|'+iso(d)];if(i==0&&v==null)continue;if(go&&P(x,v)>=x.th)c++;else go=false}
for(let i=365;i>=0;i--){const d=day(i);if(!x.days.includes(d.getDay()))continue;const v=S.ent[x.id+'|'+iso(d)];if(i==0&&v==null)continue;if(P(x,v)>=x.th){r++;b=Math.max(b,r)}else r=0}return[c,b]}
function vLock(){return `<main><div class="c f"><h2>Life Tree</h2><p class="m">${S.pin?'Entrez votre code PIN.':'Créez un code PIN de 4 à 8 chiffres.'}</p><input id="pn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="Code PIN">${S.pin?'':'<input id="pc" type="password" inputmode="numeric" maxlength="8" placeholder="Confirmer le code" autocomplete="off">'}<button class="p" data-a="unl" style="width:100%;margin-top:8px">${S.pin?'Déverrouiller':'Créer le code'}</button><p id="er" class="m"></p></div></main>`}
async function unl(){const a=$$('pn').value,e=$$('er');if(!/^\d{4,8}$/.test(a))return e.textContent='Saisissez 4 à 8 chiffres.';
if(!S.pin){if(a!==$$('pc').value)return e.textContent='Les deux codes sont différents.';const s=crypto.getRandomValues(new Uint8Array(16));S.pin={s:b64(s),h:await hp(a,s)};await save()}
else if(await hp(a,ub(S.pin.s))!==S.pin.h){tries++;e.textContent='Code incorrect. Patientez…';await new Promise(r=>setTimeout(r,Math.min(30000,tries*tries*500)));return e.textContent='Code incorrect.'}
tries=0;locked=false;render()}
let ax='A',wk=0,sel,pre='A';
const Q=(a,b,c,t)=>[0,1].map(i=>(1-t)*(1-t)*a[i]+2*(1-t)*t*b[i]+t*t*c[i]),hpts=x=>Object.keys(S.ent).filter(k=>k.startsWith(x.id+'|')).reduce((a,k)=>a+P(x,S.ent[k])*x.pts,0);
function drawTree(it){const n=it.length,st=Math.min(42,210/Math.max(n,1));
let s=`<svg viewBox="0 0 320 390" width="100%" role="img" aria-label="Arbre"><defs><radialGradient id="gl" cx="50%" cy="42%" r="55%"><stop offset="0" style="stop-color:#E0FFC2" stop-opacity=".22"/><stop offset="1" style="stop-color:#E0FFC2" stop-opacity="0"/></radialGradient></defs><rect width="320" height="390" fill="url(#gl)"/><ellipse cx="160" cy="380" rx="118" ry="6" fill="var(--deep)"/><path class="bk" d="M160 378q-24 5-44 0M160 378q24 5 44 0" stroke-width="3" stroke-linecap="round"/><path class="tk" d="M146 378C152 300 154 220 157 126L163 126C166 220 168 300 174 378Z"/>`;
it.forEach((o,i)=>{const R=i%2?1:-1,y=336-i*st,ln=48+Math.min(8,o.l)*12,a=[160,y],b=[160+R*ln*.5,y-10-o.l*2],c=[160+R*ln,y-34-Math.min(o.l,6)*4];
s+=`<path class="bk" d="M${a} Q${b} ${c}" stroke-width="4.5" stroke-linecap="round"/>`;
const nl=o.n?Math.min(12,3+o.n*2+o.l):0,col=`hsl(${28+o.v*92} 58% ${38+o.v*14}%)`;
for(let k=1;k<=nl;k++){const q=Q(a,b,c,.2+.8*k/nl),z=k%2?-1:1,ang=(R>0?0:180)+z*R*38;s+=`<path d="M0 0Q7-8 17 0Q7 8 0 0Z" fill="${col}" transform="translate(${q[0]} ${q[1]+z*2}) rotate(${ang})"/>`}
for(let k=0;k<Math.min(o.l,5);k++)s+=`<circle class="fr" cx="${c[0]-R*k*10}" cy="${c[1]+13}" r="5.5"/><circle cx="${c[0]-R*k*10-1.5}" cy="${c[1]+11}" r="1.6" fill="#fff" opacity=".5"/>`;
s+=`<text class="lb" x="${c[0]+R*4}" y="${c[1]-9}" text-anchor="middle">${o.d[0]}</text>`});return s+'</svg>'}
function ph(){const im=new Image();im.onload=()=>{const h=$$('hero');if(h){h.classList.add('ph');h.style.backgroundImage='url(hero.jpg)'}};im.src='hero.jpg'}
function vHome(){const D=disc(S.habits,7);return `<div class="hero" id="hero"><svg class="sc" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#043628"/><stop offset="1" stop-color="#0b6a4d"/></linearGradient></defs><rect width="400" height="260" fill="url(#sk)"/><circle cx="305" cy="70" r="60" fill="#E0FFC2" opacity=".12"/><circle cx="305" cy="70" r="34" fill="#E0FFC2" opacity=".92"/><path d="M0 190Q90 150 180 185T400 170V260H0Z" fill="#05503a"/><path d="M0 215Q120 185 230 212T400 205V260H0Z" fill="#043628"/><path d="M118 235C122 190 120 160 124 118L133 118C137 160 135 190 142 235Z" fill="#032a1f"/><g fill="#0a6b4e"><circle cx="128" cy="100" r="40"/><circle cx="96" cy="124" r="27"/><circle cx="162" cy="122" r="29"/></g><g fill="#E0FFC2" opacity=".55"><circle cx="112" cy="92" r="3"/><circle cx="140" cy="84" r="2.5"/><circle cx="160" cy="112" r="3"/><circle cx="94" cy="120" r="2.5"/></g></svg><div class="ht"><h1>Bienvenue Monsieur,</h1><p>on se lance sur quelle thématique ?</p></div></div><select class="pick" data-a="pick" aria-label="Thématique"><option value="">Choisir une thématique…</option>${L(DOM,d=>`<option value="${d[0]}">${d[1]}</option>`)}</select><button class="gb" data-a="go" data-i="t">Voir l’arbre global</button><p class="m">Discipline sur 7 jours : ${D?pc(D.D):'–'}</p>`}
function vAxis(){const d=DOM.find(q=>q[0]==ax),hs=S.habits.filter(x=>x.d==ax),td=iso(new Date());sel=sel||td;
const mo=new Date();mo.setDate(mo.getDate()-((mo.getDay()+6)%7)+wk*7);const dy=[0,1,2,3,4,5,6].map(i=>{const q=new Date(mo);q.setDate(mo.getDate()+i);return q}),JN=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],fm=q=>q.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const cell=(x,q)=>{const k=iso(q),v=S.ent[x.id+'|'+k];if(k>td)return '<td class="z">·</td>';if(!x.days.includes(q.getDay()))return '<td class="z">–</td>';
return '<td>'+(x.t=='done'?`<button class="cb ${v?'on':''}" data-a="tg" data-i="${x.id}" data-d="${k}" aria-label="${x.n}, ${k}">${v?'✓':''}</button>`:x.t=='self'?`<select class="ce" data-a="set" data-i="${x.id}" data-d="${k}"><option value="">–</option>${L([1,2,3],z=>`<option ${v==z?'selected':''}>${z}</option>`)}</select>`:`<input class="ce" type="number" inputmode="decimal" min="0" value="${v??''}" data-a="set" data-i="${x.id}" data-d="${k}" aria-label="${x.n}, ${k}">`)+'</td>'};
const sd=new Date(sel+'T12:00:00'),pl=hs.filter(x=>x.days.includes(sd.getDay())).map(x=>({x,p:P(x,S.ent[x.id+'|'+sel])})),li=o=>`<li><span>${o.x.n}</span><b>${pc(o.p)}</b></li>`,
D7=disc(hs,7),D28=disc(hs,28),po=hs.reduce((s,x)=>s+hpts(x),0),bs=Math.max(0,...hs.map(x=>streak(x)[1])),
rate=i=>{const q=day(i),a=hs.filter(x=>x.days.includes(q.getDay()));return a.length?a.reduce((s,x)=>s+P(x,S.ent[x.id+'|'+iso(q)]),0)/a.length:null};
const bars=[6,5,4,3,2,1,0].map((i,k)=>{const r=rate(i),h=Math.max(3,(r||0)*60);return `<rect x="${k*40+8}" y="${70-h}" width="24" height="${h}" rx="5" fill="#E0FFC2" opacity="${r==null?.15:1}"/><text class="lb" x="${k*40+20}" y="86" text-anchor="middle">${JN[(day(i).getDay()+6)%7][0]}</text>`}).join(''),
tile=(b,l)=>`<div><b>${b}</b><span>${l}</span></div>`;
return `<button class="bk2" data-a="go" data-i="j">‹ Thématiques</button><h1>${d[1]}</h1><div class="r"><button data-a="wk" data-i="-1" aria-label="Semaine précédente">‹</button><span class="m">${fm(dy[0])} – ${fm(dy[6])}</span><button data-a="wk" data-i="1" ${wk>=0?'disabled':''} aria-label="Semaine suivante">›</button></div>`+
(hs.length?`<div class="tw"><table><tr><th class="hn"></th>${L(dy,(q,i)=>`<th><button class="dh ${iso(q)==sel?'on':''}" data-a="sd" data-i="${iso(q)}">${JN[i]}<small>${q.getDate()}</small></button></th>`)}</tr>${L(hs,x=>`<tr><th class="hn">${x.n}<span>${x.t=='dur'||x.t=='qty'?x.g+' '+x.u:TY[x.t]}</span></th>${L(dy,q=>cell(x,q))}</tr>`)}</table></div>`:'<div class="c m">Aucune habitude dans cette thématique.</div>')+
`<button class="gb" data-a="go" data-i="h">Ajouter une habitude</button><h3>Bilan du ${fm(sd)}</h3>`+(pl.length?`<div class="sw"><div><b>Points forts</b><ul>${L(pl.filter(o=>o.p>=o.x.th),li)||'<li class="m">Aucun</li>'}</ul></div><div><b>Points faibles</b><ul>${L(pl.filter(o=>o.p<o.x.th),li)||'<li class="m">Aucun</li>'}</ul></div></div>`:'<p class="m">Aucune habitude prévue ce jour-là.</p>')+
`<h3>Statistiques</h3><div class="tl">${tile(D7?pc(D7.D):'–','discipline 7 j')}${tile(D28?pc(D28.D):'–','discipline 28 j')}${tile(lvl(po),'niveau')}${tile(Math.round(po),'points')}${tile(bs,'meilleure série')}${tile(hs.length,'habitudes')}</div><div class="c"><svg viewBox="0 0 280 92" width="100%" role="img" aria-label="Réussite des 7 derniers jours">${bars}</svg><div class="m">Réussite moyenne par jour, 7 derniers jours</div></div><h3>Arbre de la thématique</h3><div class="tr">${drawTree(hs.map(x=>({d:[x.n[0].toUpperCase(),x.n],l:lvl(hpts(x)),v:(disc([x],28)||{D:0}).D,n:1})))}</div><p class="m">Une branche par habitude : la hauteur suit les points cumulés, le feuillage suit les 28 derniers jours.</p>`}
function vTree(){const info=DOM.map(d=>{const p=pts(d[0]),hs=S.habits.filter(x=>x.d==d[0]),v=disc(hs,28);return{d,p,l:lvl(p),v:v?v.D:0,n:hs.length}}),avg=info.reduce((s,o)=>s+o.l,0)/info.length;
return `<div class="m">Niveau moyen ${avg.toFixed(1)}</div><h1>Arbre global</h1><div class="tr">${drawTree(info)}</div><p class="m">Hauteur : points cumulés, jamais perdus. Feuillage : discipline sur 28 jours. Un fruit par niveau.</p><div class="ls">`+L(info,o=>`<div class="hr"><span class="bg2">${o.d[0]}</span><div class="hm"><b>${o.d[1]}</b><span>Niveau ${o.l} · ${Math.round(o.p*10)/10} pts · palier suivant ${50*(o.l+1)*(o.l+2)} · vitalité ${pc(o.v)}${o.n?'':' · aucune habitude'}</span><div class="bar"><i style="width:${o.v*100}%"></i></div></div></div>`)+`</div>`}
function vHab(){return `<div class="c f"><b>Nouvelle habitude</b><input id="hn" placeholder="Nom"><select id="hd">${L(DOM,d=>`<option value="${d[0]}" ${d[0]==pre?'selected':''}>${d[1]}</option>`)}</select><select id="ht">${L(Object.keys(TY),k=>`<option value="${k}">${TY[k]}</option>`)}</select><input id="hg" type="number" inputmode="decimal" placeholder="Cible (durée ou quantité)"><input id="hu" placeholder="Unité (min, pompes…)"><select id="hp"><option value="1">1 point</option><option value="2">2 points</option><option value="3">3 points</option></select><div class="dy">${L([1,2,3,4,5,6,0],d=>`<label><input type="checkbox" class="dd" value="${d}" checked>${'DLMMJVS'[d]}</label>`)}</div><button class="p" data-a="add">Ajouter l’habitude</button></div>`+L(S.habits,x=>`<div class="c r"><div><b>${x.n}</b><div class="m">${x.d} · ${TY[x.t]}${x.g>1||x.t=='dur'||x.t=='qty'?' · '+x.g+' '+x.u:''} · ${x.pts} pt</div></div><button data-a="del" data-i="${x.id}" aria-label="Supprimer">Supprimer</button></div>`)}

await save();render()});
